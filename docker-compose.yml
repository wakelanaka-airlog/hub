services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hub-mosquitto
    restart: unless-stopped
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: hub-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RESTAPI_DB_USER: ${RESTAPI_DB_USER}
      RESTAPI_DB_PASSWORD: ${RESTAPI_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d

  collector:
    build: ./collector
    container_name: hub-collector
    restart: unless-stopped
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    depends_on:
      - mosquitto
      - timescaledb

  restapi:
    build: ./restapi
    container_name: hub-restapi
    restart: unless-stopped
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${RESTAPI_DB_USER}
      POSTGRES_PASSWORD: ${RESTAPI_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RESTAPI_API_KEY: ${RESTAPI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb

volumes:
  mosquitto-data:
  mosquitto-log:
  timescaledb-data:
