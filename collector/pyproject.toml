[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
