[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restapi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
