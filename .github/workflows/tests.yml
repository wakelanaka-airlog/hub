name: Tests

on:
  push:
  pull_request:

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: collector
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: collector
        run: pytest

  restapi-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: restapi
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: restapi
        run: pytest
